name: Decompile PvpBot
on: workflow_dispatch
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download CFR
        run: curl -L -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
      - name: Decompile
        run: java -jar cfr.jar plugin/PvpBot.jar --outputdir src-out --silent true
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-decompiled
          path: src-out
